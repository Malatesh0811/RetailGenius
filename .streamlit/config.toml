[theme]
primaryColor = "#3B82F6"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
port = 8501
# CORS and XSRF protection stay ON (Streamlit defaults). They were disabled before,
# which lets other websites send requests to the app on the user's behalf.
[client]
# Hide the developer toolbar ("Deploy" button, rerun menu) from visitors.
toolbarMode = "viewer"
